<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epic Life Ledger</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<style>
  html, body { margin: 0; }
  :root {
    --paper: #f3f4ef; --paper-raised: #ffffff; --ink: #1a2420; --ink-soft: #47544d;
    --line: #d8dbd2; --ledger: #234b42;
    --shadow: 0 1px 2px rgba(26,36,32,0.06), 0 6px 20px rgba(26,36,32,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #121613; --paper-raised: #181d19; --ink: #e8e9e2; --ink-soft: #a9b3ac; --line: #2b332e; --ledger: #7fb89c; }
  }
  :root[data-theme="dark"] { --paper: #121613; --paper-raised: #181d19; --ink: #e8e9e2; --ink-soft: #a9b3ac; --line: #2b332e; --ledger: #7fb89c; }
  :root[data-theme="light"] { --paper: #f3f4ef; --paper-raised: #ffffff; --ink: #1a2420; --ink-soft: #47544d; --line: #d8dbd2; --ledger: #234b42; }
  body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 420px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; box-shadow: var(--shadow); text-align: center; }
  .card .icon { font-size: 32px; margin-bottom: 12px; }
  .card h1 { font-size: 1.15rem; margin: 0 0 10px; color: var(--ink); }
  .card p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; }
  .back { display: inline-block; margin-top: 20px; font-size: 0.8rem; font-weight: 600; color: var(--ledger); text-decoration: none; }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📒</div>
    <h1>This tool has moved</h1>
    <p>The Epic Life Ledger is no longer available at this address.</p>
    <a class="back" href="../">← Entrepreneur Paradise</a>
  </div>
</body>
</html>
